name: NotchBuddy
options:
  bundleIdPrefix: fr.louisraille
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 256AUJ9555
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_ENTITLEMENTS: Resources/Crew.entitlements

# Única dependência de terceiros: o emulador de terminal.
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.10.0

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  NotchBuddy:
    type: application
    platform: macOS
    dependencies:
      - package: SwiftTerm
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Crew
        CFBundleDisplayName: Crew
        CFBundleIdentifier: fr.louisraille.NotchBuddy
        CFBundleVersion: "2"
        CFBundleShortVersionString: "0.1.1"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        CFBundleURLTypes:
          - CFBundleURLName: "Crew"
            CFBundleURLSchemes: ["crew"]
        NSAppleEventsUsageDescription: "Para controlar a música (Spotify e Música) e ir até o terminal."
        NSAudioCaptureUsageDescription: "Para mudar o volume de cada app: o Crew pega o som do app, ajusta o volume e toca de volta. Nada é gravado nem sai do Mac."
        NSMicrophoneUsageDescription: "Para o ditado (o Crew ouve só enquanto você dita e transforma a fala em texto neste Mac) e para a sua voz entrar na gravação de tela, quando você liga o microfone nela. O vídeo fica neste Mac."
        NSSpeechRecognitionUsageDescription: "Para transformar em texto o que você dita e para legendar as gravações de tela que você manda editar. O reconhecimento é feito neste Mac; o ditado só usa a Apple se você permitir nos ajustes da Voz. Nada é gravado."
        NSCameraUsageDescription: "Para a bolha da câmera na gravação de tela (só enquanto você grava ou pede para ver) e para os sites que você abre no navegador do Crew e que pedem a câmera. O Crew pergunta site por site."
        NSLocationUsageDescription: "Para os sites que você abre no navegador do Crew e que pedem a sua localização. O Crew pergunta site por site."
        NSLocationWhenInUseUsageDescription: "Para os sites que você abre no navegador do Crew e que pedem a sua localização. O Crew pergunta site por site."
        NSAccessibilityUsageDescription: "Para as teclas de brilho e volume mostrarem o nível na ilha e para anexar a janela ativa ao chat."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.louisraille.NotchBuddy
        PRODUCT_NAME: Crew
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
